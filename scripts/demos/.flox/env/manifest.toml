schema-version = "1.12.0"

[install]
# Orchestrates the demo processes defined in each demo's process-compose.yaml.
process-compose.pkg-path = "process-compose"

# Used throughout the demo scripts: JSON parsing (jq), downloads and Koios/Submit
# API calls (curl), database synchronization into per-node run directories (rsync).
jq.pkg-path = "jq"
curl.pkg-path = "curl"
rsync.pkg-path = "rsync"
gawk.pkg-path = "gawk"
procps.pkg-path = "procps"
ripgrep.pkg-path = "ripgrep"
gnutar.pkg-path = "gnutar"
fd.pkg-path = "fd"
gzip.pkg-path = "gzip"

# Hex encoding of signed transaction CBOR in tx.sh.
xxd.pkg-path = "unixtools.xxd"

# The demo scripts are bash and expect GNU userland behavior everywhere, so provide the
# shell and core tools from the environment instead of relying on the host (macOS ships
# bash 3.2 and BSD variants of the core utilities).
bash.pkg-path = "bash"
# On Linux both coreutils and procps provide bin/kill; let the specialized packages win
# overlapping files (higher priority value = lower precedence).
coreutils.pkg-path = "coreutils"
coreutils.priority = 6
diffutils.pkg-path = "diffutils"

# CA certificates so curl can verify TLS endpoints inside minimal containers built with
# `flox containerize` (hosts normally provide their own trust store).
cacert.pkg-path = "cacert"

# Rust toolchain manager for building the amaru node; the repository's
# rust-toolchain.toml selects the pinned nightly on first cargo invocation.
rustup.pkg-path = "rustup"

# cardano-cli is deliberately absent: it is not in the Flox catalog, and the only way to express
# it here is through the cardano-node flake, whose closure nix can only realize on a machine that
# already trusts IOG's binary cache. It now publishes standalone releases, so the demos download a
# pinned, checksum-verified binary instead (CARDANO_CLI_RELEASE_VERSION, common/cardano-cli.sh).

[options]
systems = [
  "aarch64-darwin",
  "x86_64-darwin",
  "aarch64-linux",
  "x86_64-linux",
]
