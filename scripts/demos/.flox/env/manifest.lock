    "hook": {
      "on-activate": "  # cardano-cli is not packaged in the Flox catalog. The demo `setup` step downloads\n  # a cardano-node release (which bundles cardano-cli) into $LOGDIR, so point\n  # CARDANO_CLI at that copy when no cardano-cli is already on PATH.\n  if [[ -z \"${CARDANO_CLI:-}\" ]] && ! command -v cardano-cli >/dev/null 2>&1; then\n    for candidate in /tmp/amaru-*/cardano-node-*/bin/cardano-cli; do\n      if [[ -x \"$candidate\" ]]; then\n        export CARDANO_CLI=\"$candidate\"\n        break\n      fi\n    done\n  fi\n\n  # The telemetry stack (Grafana/Tempo/Prometheus/Loki) needs a Docker daemon, which\n  # Flox cannot provide. Run the demos with START_TELEMETRY=false when Docker is\n  # not available on the host.\n  if ! command -v docker >/dev/null 2>&1; then\n    echo \"note: docker not found; run the demos with START_TELEMETRY=false\" >&2\n  fi\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "x86_64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
