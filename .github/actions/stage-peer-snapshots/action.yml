name: Stage peer snapshots
description: >
  Stages Cardano peer snapshots for amaru-node build embedding using Git,
  without GitHub API requests or a token.

runs:
  using: composite
  steps:
    - name: Stage peer snapshots
      shell: bash
      run: bash "${{ github.workspace }}/scripts/stage-peer-snapshots"

    - name: Prefer staged snapshots; hide token from later steps
      shell: bash
      run: |
        {
          echo "AMARU_SKIP_PEER_SNAPSHOT_FETCH=1"
          echo "GITHUB_TOKEN="
          echo "GH_TOKEN="
        } >> "$GITHUB_ENV"
