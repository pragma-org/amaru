name: bootstrap-db

description: Restore or create Amaru bootstrap DBs for a given network

inputs:
  network:
    description: Network name (preprod, preview, mainnet)
    required: true
  epoch:
    description: Target epoch for the bootstrap, use latest available if empty.
    type: string

  # Bump this version whenever the ledger or chain store serialisation format
  # changes and the cached databases become incompatible.
  # This is the single source of truth for the bootstrap cache key version.
  cache-version:
    description: Cache key version
    required: false
    default: "v19"

runs:
  using: composite
  steps:
    - name: Restore Amaru bootstrap DBs
      id: cache-restore
      uses: actions/cache/restore@v5
      with:
        path: |
          ./ledger.${{ inputs.network }}.db
          ./chain.${{ inputs.network }}.db
        # Epoch is part of the key so a "latest" bootstrap (nightly) cannot
        # overwrite a pinned-epoch cache used by e2e snapshot tests.
        # Bump cache-version when the ledger or chain store serialisation
        # format changes and cached databases become incompatible.
        key: bootstrap-state-${{ runner.os }}-${{ inputs.network }}-${{ inputs.cache-version }}-${{ inputs.epoch || 'latest' }}

    - name: Bootstrap Amaru from scratch
      if: steps.cache-restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        AMARU_NETWORK: ${{ inputs.network }}
        AMARU_LEDGER_DIR: ./ledger.${{ inputs.network }}.db
        AMARU_CHAIN_DIR: ./chain.${{ inputs.network }}.db
        AMARU_EPOCH: ${{ inputs.epoch }}
      run: |
        if [[ -z "${AMARU_EPOCH}" ]]; then
          unset AMARU_EPOCH
        fi
        cargo run --profile test -- node bootstrap

    - name: Save bootstrap DBs to cache
      if: steps.cache-restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v5
      with:
        path: |
          ./ledger.${{ inputs.network }}.db
          ./chain.${{ inputs.network }}.db
        key: bootstrap-state-${{ runner.os }}-${{ inputs.network }}-${{ inputs.cache-version }}-${{ inputs.epoch || 'latest' }}
