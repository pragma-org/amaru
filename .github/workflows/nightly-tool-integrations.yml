name: Nightly Tool Integrations

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  prepare:
    name: Build Amaru & restore bootstrap DBs
    runs-on: ubuntu-24.04
    env:
      AMARU_NETWORK: preprod
      AMARU_CHAIN_DIR: ./chain.preprod.db
      AMARU_LEDGER_DIR: ./ledger.preprod.db
      AMARU_LISTEN_ADDRESS: 127.0.0.1:3000
      AMARU_PEER_ADDRESS: preprod-node.play.dev.cardano.org:3001
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/stage-peer-snapshots

      - uses: ./.github/actions/cache

      - name: Build Amaru
        shell: bash
        run: |
          cargo build --release --bin amaru --locked

      - name: Bootstrap DBs
        uses: ./.github/actions/bootstrap-db
        with:
          network: preprod

      - name: Start Amaru
        shell: bash
        run: |
          ./target/release/amaru node run > amaru.log 2>&1 &
          echo $! > amaru.pid

      - name: Wait for Amaru to be ready
        shell: bash
        run: |
          timeout 60 bash -c 'until nc -z 127.0.0.1 3000; do sleep 1; done' || {
            echo "Amaru did not start within 60s. Last log lines:"
            tail -50 amaru.log
            exit 1
          }

      - name: Wait for Amaru to adopt at least one block
        shell: bash
        run: |
          # adopt_chain only fires after fetch_blocks stored the body and validate_block
          # completed. Waiting for the first "adopted tip" guarantees at least one block
          # body is in the chain DB before tools attempt to fetch via BlockFetch.
          timeout 300 bash -c 'until grep -q "adopted tip" amaru.log; do sleep 2; done' || {
            echo "Amaru did not adopt a block within 5 minutes. Last log lines:"
            tail -50 amaru.log
            exit 1
          }

      - name: Stop Amaru
        shell: bash
        run: |
          kill "$(cat amaru.pid)"

      - name: Upload Amaru artifacts
        uses: actions/upload-artifact@v7
        with:
          name: amaru-preprod
          path: |
            target/release/amaru
            ledger.preprod.db
            chain.preprod.db
          retention-days: 1

  test-tools:
    name: Test ${{ matrix.tool.name }}
    needs: prepare
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yaci_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AMARU_NETWORK: preprod
      AMARU_CHAIN_DIR: ./chain.preprod.db
      AMARU_LEDGER_DIR: ./ledger.preprod.db
      AMARU_LISTEN_ADDRESS: 127.0.0.1:3000
      AMARU_PEER_ADDRESS: preprod-node.play.dev.cardano.org:3001
    strategy:
      fail-fast: false
      matrix:
        tool:
          - name: Oura
            install: |
              curl --proto '=https' --tlsv1.2 -LsSf \
                https://github.com/txpipe/oura/releases/latest/download/oura-installer.sh | sh
            setup: ""
            run: oura watch 127.0.0.1:3000 --bearer tcp
            output: oura-output.txt
            success-pattern: "BLOCK:"

          - name: Dolos
            install: |
              curl --proto '=https' --tlsv1.2 -LsSf \
                https://github.com/txpipe/dolos/releases/latest/download/dolos-installer.sh | sh
              make download-haskell-config HASKELL_NODE_CONFIG_DIR=cardano-node-config AMARU_NETWORK=preprod
            setup: |
              sed "s|cardano-node-config/|${PWD}/cardano-node-config/|g" \
                .github/dolos.toml > dolos.toml
            run: dolos daemon
            output: dolos-output.txt
            success-pattern: "apply"

          - name: Yaci Store
            install: |
              version=$(curl -sf \
                "https://api.github.com/repos/bloxbean/yaci-store/releases/latest" \
                | jq -r '.tag_name | ltrimstr("v")')
              echo "Installing yaci-store $version"
              curl -LsSf -o yaci-store.zip \
                "https://github.com/bloxbean/yaci-store/releases/download/rel-native-${version}/yaci-store-${version}-linux-x64-all.zip"
              unzip -q yaci-store.zip -d yaci-store-bin
              chmod +x yaci-store-bin/*/yaci-store
            setup: |
              # Point Yaci at Amaru's current best tip so it only requests blocks Amaru already
              # has bodies for, rather than the entire chain history from the well-known point.
              TIP_POINT=$(./target/release/amaru dev chain best-chain \
                --network preprod 2>/dev/null | grep "Best tip (stored):" | awk '{print $NF}')
              TIP_SLOT=$(echo "$TIP_POINT" | cut -d. -f1)
              TIP_HASH=$(echo "$TIP_POINT" | cut -d. -f2)
              export STORE_CARDANO_HOST=127.0.0.1
              export STORE_CARDANO_PORT=3000
              export STORE_CARDANO_PROTOCOL_MAGIC=1
              export STORE_CARDANO_SYNC_START_SLOT="$TIP_SLOT"
              export STORE_CARDANO_SYNC_START_BLOCKHASH="$TIP_HASH"
              export SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/yaci_store"
              export SPRING_DATASOURCE_USERNAME=postgres
              export SPRING_DATASOURCE_PASSWORD=postgres
            run: yaci-store-bin/*/yaci-store
            output: yaci-store-output.txt
            success-pattern: "Handshake Ok"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Amaru artifacts
        uses: actions/download-artifact@v4
        with:
          name: amaru-preprod

      - name: Restore executable permissions
        shell: bash
        run: chmod +x target/release/amaru

      - name: Start Amaru
        shell: bash
        run: |
          ./target/release/amaru node run > amaru.log 2>&1 &
          echo $! > amaru.pid

      - name: Wait for Amaru to be ready
        shell: bash
        run: |
          timeout 60 bash -c 'until nc -z 127.0.0.1 3000; do sleep 1; done' || {
            echo "Amaru did not start within 60s. Last log lines:"
            tail -50 amaru.log
            exit 1
          }

      - name: Install ${{ matrix.tool.name }}
        shell: bash
        run: ${{ matrix.tool.install }}

      - name: Run ${{ matrix.tool.name }}
        shell: bash
        run: |
          ${{ matrix.tool.setup }}
          set +e
          timeout 120 ${{ matrix.tool.run }} 2>&1 | tee ${{ matrix.tool.output }}
          set -e
          grep -q '${{ matrix.tool.success-pattern }}' ${{ matrix.tool.output }} || {
            echo "Expected '${{ matrix.tool.success-pattern }}' in ${{ matrix.tool.name }} output but did not find it"
            exit 1
          }

      - name: Stop Amaru
        if: always()
        shell: bash
        run: |
          kill "$(cat amaru.pid)" || true

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.tool.name }}-output
          path: |
            amaru.log
            ${{ matrix.tool.output }}

  metrics-coverage:
    name: Metrics coverage vs cardano-node
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      AMARU_NETWORK: preprod
      AMARU_CHAIN_DIR: ./chain.preprod.db
      AMARU_LEDGER_DIR: ./ledger.preprod.db
      AMARU_LISTEN_ADDRESS: 127.0.0.1:3000
      AMARU_PEER_ADDRESS: preprod-node.play.dev.cardano.org:3001
      AMARU_WITH_OPEN_TELEMETRY: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
      CARDANO_NODE_VERSION: "11.0.1"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Amaru artifacts
        uses: actions/download-artifact@v4
        with:
          name: amaru-preprod

      - name: Restore executable permissions
        shell: bash
        run: chmod +x target/release/amaru

      - name: Start OTLP collector
        shell: bash
        run: |
          docker run -d --network host \
            --name otlp-collector \
            -v "$PWD/monitoring/otlp-collector.yml:/etc/otlp-collector.yml:ro" \
            -v "$PWD/monitoring/profiles/prometheus/otlp-collector.yml:/etc/otlp-collector-prometheus.yml:ro" \
            otel/opentelemetry-collector-contrib:0.127.0 \
              --config=/etc/otlp-collector.yml \
              --config=/etc/otlp-collector-prometheus.yml

      - name: Start cardano-node
        shell: bash
        run: |
          mkdir -p /tmp/cardano-db
          docker run -d --network host \
            --name cardano-node \
            -v "$PWD/cardano-node-config:/config:ro" \
            -v "/tmp/cardano-db:/data" \
            ghcr.io/intersectmbo/cardano-node:${{ env.CARDANO_NODE_VERSION }} run \
              --config /config/config.json \
              --topology /config/topology.json \
              --database-path /data \
              --socket-path /tmp/cardano.socket \
              --host-addr 127.0.0.1 \
              --port 3001

      - name: Start Amaru
        shell: bash
        run: |
          ./target/release/amaru node run > amaru.log 2>&1 &
          echo $! > amaru.pid

      - name: Wait for Amaru metrics endpoint
        shell: bash
        run: |
          timeout 120 bash -c \
            'until curl -sf http://localhost:8889/metrics >/dev/null; do sleep 2; done' || {
            echo "Amaru OTLP metrics endpoint did not become ready within 120s."
            echo "--- Amaru log (last 50 lines) ---"
            tail -50 amaru.log
            echo "--- OTLP collector log ---"
            docker logs otlp-collector 2>&1 | tail -20 || true
            exit 1
          }

      - name: Wait for cardano-node metrics endpoint
        shell: bash
        run: |
          timeout 120 bash -c \
            'until curl -sf http://localhost:12798/metrics >/dev/null; do sleep 2; done' || {
            echo "cardano-node metrics endpoint did not become ready within 120s."
            docker logs cardano-node 2>&1 | tail -30 || true
            exit 1
          }

      - name: Compare metrics
        shell: bash
        run: |
          scripts/compare-metrics \
            --output metrics-report.json \
            --summary

      - name: Upload metrics report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metrics-coverage-report
          path: metrics-report.json
          if-no-files-found: warn

      - name: Stop Amaru
        if: always()
        shell: bash
        run: |
          [[ -f amaru.pid ]] && kill "$(cat amaru.pid)" 2>/dev/null || true
