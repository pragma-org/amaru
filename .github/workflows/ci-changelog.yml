name: CI Changelog

permissions:
  actions: read
  issues: write
  pull-requests: read

on:
  workflow_run:
    workflows: ["CI Coding Practices"]
    types: [completed]

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      # This workflow has permission to write issue comments. Keep its inputs limited
      # to GitHub's workflow-run metadata; never check out or execute PR-controlled code.
      - name: Synchronize PR changelog comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # https://github.com/actions/github-script/releases/tag/v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- amaru:changelog-check -->';
            const run = context.payload.workflow_run;
            const headOwner = run.head_repository?.owner?.login;

            if (!headOwner || !run.head_branch) {
              core.warning(`Workflow run ${run.id} has no source repository or branch.`);
              return;
            }

            const pullRequests = await github.paginate(
              github.rest.pulls.list,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${headOwner}:${run.head_branch}`,
                per_page: 100,
              },
            );
            const matchingPullRequests = pullRequests.filter((pullRequest) =>
              pullRequest.base?.repo?.id === context.payload.repository.id &&
              pullRequest.head?.repo?.id === run.head_repository.id &&
              pullRequest.head?.sha === run.head_sha &&
              pullRequest.head?.ref === run.head_branch
            );

            if (matchingPullRequests.length !== 1) {
              core.warning(`Expected one open PR for workflow run ${run.id}; found ${matchingPullRequests.length}.`);
              return;
            }

            const issue_number = matchingPullRequests[0].number;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              filter: 'latest',
              per_page: 100,
            });
            const changelogJob = jobs.find((job) => job.name === 'changelog');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const matchingComments = comments.filter((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker)
            );
            const newestMatchingComment = matchingComments.at(-1);

            async function deleteMatchingComments(exceptCommentId) {
              for (const comment of matchingComments) {
                if (comment.id === exceptCommentId) {
                  continue;
                }

                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            if (changelogJob?.conclusion !== 'failure') {
              await deleteMatchingComments();
              return;
            }

            const body = `${marker}\n## Changelog check failed\n\nSee the [workflow run](${run.html_url}) for details.`;

            if (newestMatchingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: newestMatchingComment.id,
                body,
              });
              await deleteMatchingComments(newestMatchingComment.id);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
