name: CI Coding Practices

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, edited, converted_to_draft, ready_for_review]
    branches: ["*"]

env:
  # NOTE: Necessary for cache
  CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rust-toolchain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/check-rust-toolchain-version

  changes:
    runs-on: ubuntu-24.04
    # Expose path groups to the jobs that apply dependency and changelog policies.
    outputs:
      crates: ${{ steps.changes.outputs.crates }}
      dependencies: ${{ steps.changes.outputs.dependencies }}
      dependency_manifests: ${{ steps.changes.outputs.dependency_manifests }}
      lockfiles: ${{ steps.changes.outputs.lockfiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # https://github.com/dorny/paths-filter/releases/tag/v4.0.3
        id: changes
        with:
          filters: |
            crates:
              - "crates/**"
            dependencies:
              - "Cargo.toml"
              - "Cargo.lock"
              - ".cargo/config.toml"
              - ".cargo/deny.toml"
              - ".config/hakari.toml"
              - "crates/**/Cargo.toml"
              - "crates/**/Cargo.lock"
            dependency_manifests:
              - "Cargo.toml"
              - ".config/hakari.toml"
              - "crates/**/Cargo.toml"
            lockfiles:
              - "Cargo.lock"
              - "crates/**/Cargo.lock"

  lockfile-policy:
    name: Lockfile policy
    needs: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject unexplained lockfile-only changes
        if: >-
          needs.changes.outputs.lockfiles == 'true' &&
          needs.changes.outputs.dependency_manifests != 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'TOPIC.Dependencies')
        run: |
          echo "Cargo.lock changed without a dependency manifest change."
          echo "A maintainer must apply the TOPIC.Dependencies label for an intentional lockfile-only update."
          exit 1

  dependency-review:
    name: Dependency review
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.dependencies == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # https://github.com/actions/dependency-review-action/releases/tag/v4.9.0
        with:
          fail-on-severity: moderate

  changelog:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.crates == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate changelog updates
        id: validate
        continue-on-error: true
        run: python3 scripts/check-changelog --report-file changelog-check-report.md
      - name: Prepare changelog report artifact
        if: always()
        run: |
          mkdir -p changelog-check-artifact
          printf '%s\n' '${{ github.event.pull_request.number }}' > changelog-check-artifact/pr_number
          printf '%s\n' '${{ steps.validate.outcome }}' > changelog-check-artifact/outcome
          if [ -f changelog-check-report.md ]; then
            cp changelog-check-report.md changelog-check-artifact/report.md
          fi
      - name: Upload changelog report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        with:
          name: changelog-check-report
          path: changelog-check-artifact
          if-no-files-found: error
      - name: Fail on changelog validation errors
        if: steps.validate.outcome != 'success'
        run: |
          echo "Changelog validation failed."
          echo
          if [ -f changelog-check-report.md ]; then
            cat changelog-check-report.md
          else
            echo "No report file was generated; see the 'Validate changelog updates' step for details."
          fi
          exit 1

  unused-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: jaxxstorm/action-install-gh-release@c5ead9a448b4660cf1e7866ee22e4dc56538031a # https://github.com/jaxxstorm/action-install-gh-release/releases/tag/v1.10.0
        with:
          repo: bnjbvr/cargo-machete
          tag: v0.7.0
          binaries-location: cargo-machete-v0.7.0-x86_64-unknown-linux-musl
      - run: cargo machete

  hakari:
    needs: changes
    if: ${{ needs.changes.outputs.dependencies == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # https://github.com/taiki-e/install-action/releases/tag/v2.87.12
        with:
          tool: cargo-hakari@0.9.38
      - run: cargo hakari generate --diff

  licenses-compatibility:
    needs: changes
    if: ${{ needs.changes.outputs.dependencies == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: jaxxstorm/action-install-gh-release@c5ead9a448b4660cf1e7866ee22e4dc56538031a # https://github.com/jaxxstorm/action-install-gh-release/releases/tag/v1.10.0
        with:
          repo: EmbarkStudios/cargo-deny
          tag: 0.20.2
          binaries-location: cargo-deny-0.20.2-x86_64-unknown-linux-musl
      - run: cargo deny-amaru

  license-headers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: viperproject/check-license-header@e06c65614fa9f32e099838df4dd25440c5344b32 # https://github.com/viperproject/check-license-header/releases/tag/v2.0.3
        with:
          path: .
          config: .github/check-license-header.config.json
          strict: false

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/stage-peer-snapshots
      - uses: ./.github/actions/cache
      - run: cargo clippy-amaru

  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt-amaru

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/stage-peer-snapshots
      - uses: ./.github/actions/cache
      - name: Check documentation
        run: |
          export RUSTDOCFLAGS="-D warnings"
          cargo doc --no-deps --workspace
          cargo doc -p amaru --no-deps --all-features
