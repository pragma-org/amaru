name: Publish Bootstrap Snapshots

# See docs/PUBLISHING_SNAPSHOTS.md for runner provisioning and operations.

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to publish snapshots for"
        required: true
        type: choice
        options:
          - preprod
          - preview
          - mainnet
          - all
        default: preprod
      epoch:
        description: "Target bootstrap epoch (defaults to the latest network epoch)"
        required: false
        type: string
        default: ""
      skip_verification:
        description: "Skip the bootstrap smoke test against the published snapshots"
        required: false
        type: boolean
        default: false
      db_analyser_consensus_rev:
        description: "ouroboros-consensus git rev to build db-analyser from with nix (needs the --analyse-from fix from IntersectMBO/ouroboros-consensus#2061)"
        required: false
        type: string
        default: "aa96807e6891071c3553d19c07be2d39ab5c0a78"
      cardano_node_version:
        description: "cardano-node release tag to download db-analyser from when nix is unavailable (its bundled db-analyser ignores --analyse-from, forcing full genesis replays)"
        required: false
        type: string
        default: "11.0.1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_LOG: error
  CARDANO_NODE_VERSION: ${{ inputs.cardano_node_version }}
  DB_ANALYSER_CONSENSUS_REV: ${{ inputs.db_analyser_consensus_rev }}

jobs:
  publish:
    name: Create & publish ${{ matrix.network }} bootstrap snapshots
    runs-on: [self-hosted, snapshots]
    timeout-minutes: 2880
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        network: ${{ inputs.network == 'all' && fromJSON('["preview", "preprod", "mainnet"]') || fromJSON(format('["{0}"]', inputs.network)) }}
    concurrency:
      group: publish-snapshots-${{ matrix.network }}
      cancel-in-progress: false
    env:
      AMARU_NETWORK: ${{ matrix.network }}
      INPUT_EPOCH: ${{ inputs.epoch }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6.0.2
        with:
          persist-credentials: false

      - name: Preflight checks
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$INPUT_EPOCH" ]; then
            if ! [[ "$INPUT_EPOCH" =~ ^[0-9]+$ ]] || [ "$INPUT_EPOCH" -eq 0 ]; then
              echo "::error::epoch must be a positive integer (non-zero), got '$INPUT_EPOCH'" >&2
              exit 1
            fi
          fi

      - name: Resolve persistent cache directories
        shell: bash
        run: |
          set -euo pipefail
          CACHE_ROOT="${{ vars.SNAPSHOTS_CACHE_DIR || '' }}"
          if [ -z "$CACHE_ROOT" ]; then
            CACHE_ROOT="$HOME/amaru-snapshots"
          fi
          mkdir -p "$CACHE_ROOT/$AMARU_NETWORK"
          echo "CACHE_ROOT=$CACHE_ROOT" >> "$GITHUB_ENV"
          echo "AMARU_DIST_DIR=$CACHE_ROOT/$AMARU_NETWORK/dist" >> "$GITHUB_ENV"
          echo "AMARU_SNAPSHOTS_DIR=$CACHE_ROOT/$AMARU_NETWORK/snapshots" >> "$GITHUB_ENV"

      # No cardano-node release bundles the db-analyser --analyse-from fix yet
      # (IntersectMBO/ouroboros-consensus#2061); without it every snapshot is a
      # full genesis replay. Build the fixed binary with nix (served pre-built
      # by cache.iog.io) and only fall back to the cardano-node release binary
      # when nix is unavailable on the runner.
      - name: Install db-analyser
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          echo "DB_ANALYSER_TMP=$tmp" >> "$GITHUB_ENV"
          mkdir -p "$tmp/bin"

          if command -v nix >/dev/null 2>&1; then
            echo "building db-analyser from ouroboros-consensus @ $DB_ANALYSER_CONSENSUS_REV"
            nix build --accept-flake-config \
              --out-link "$tmp/db-analyser-result" \
              "github:IntersectMBO/ouroboros-consensus/$DB_ANALYSER_CONSENSUS_REV#db-analyser"
            install -m 755 "$tmp/db-analyser-result/bin/db-analyser" "$tmp/bin/db-analyser"
          else
            echo "::warning::nix not found on the runner; using the db-analyser bundled with cardano-node $CARDANO_NODE_VERSION, which ignores --analyse-from and replays every snapshot from genesis"
            case "$(uname -s)" in
              Linux) os=linux ;;
              Darwin) os=macos ;;
              *) echo "::error::unsupported operating system: $(uname -s)" >&2; exit 1 ;;
            esac
            case "$(uname -m)" in
              x86_64 | amd64) arch=amd64 ;;
              arm64 | aarch64) arch=arm64 ;;
              *) echo "::error::unsupported architecture: $(uname -m)" >&2; exit 1 ;;
            esac

            asset="cardano-node-$CARDANO_NODE_VERSION-$os-$arch.tar.gz"
            base_url="https://github.com/IntersectMBO/cardano-node/releases/download/$CARDANO_NODE_VERSION"
            echo "downloading $base_url/$asset"
            curl -fsSL -o "$tmp/$asset" "$base_url/$asset"
            curl -fsSL -o "$tmp/sums.txt" "$base_url/cardano-node-$CARDANO_NODE_VERSION-sha256sums.txt"
            (cd "$tmp" && grep " $asset\$" sums.txt | (sha256sum -c - 2>/dev/null || shasum -a 256 -c -))
            tar -xzf "$tmp/$asset" -C "$tmp" --strip-components 1
            rm "$tmp/$asset" "$tmp/sums.txt"
          fi

          echo "$tmp/bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/stage-peer-snapshots

      # Self-hosted runner services can lose rustup's bin directory from their
      # PATH (it comes from the runner's .path file, not a login shell), so put
      # it back explicitly and fall back to installing rustup when absent.
      - name: Ensure Rust toolchain on PATH
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/cargo" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          elif ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Build amaru
        shell: bash
        run: |
          cargo build --release --bin amaru

      - name: Create snapshots
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/amaru snapshot create \
            --network "$AMARU_NETWORK" \
            ${INPUT_EPOCH:+--epoch "$INPUT_EPOCH"}

      - name: Publish snapshots to R2 and update index
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AMARU_S3_REGION: auto
          AMARU_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          AMARU_S3_BUCKET: ${{ secrets.SNAPSHOTS_BUCKET_NAME }}
          AMARU_S3_PUBLIC_URL: ${{ vars.SNAPSHOTS_PUBLIC_URL_BASE || secrets.SNAPSHOTS_PUBLIC_URL_BASE }}
        run: |
          set -euo pipefail
          ./target/release/amaru snapshot publish --network "$AMARU_NETWORK"

      - name: Verify published snapshots with a full bootstrap
        if: ${{ !inputs.skip_verification }}
        shell: bash
        run: |
          set -euo pipefail
          SCRATCH="$(mktemp -d)"
          echo "SCRATCH=$SCRATCH" >> "$GITHUB_ENV"
          cd "$SCRATCH"
          "$GITHUB_WORKSPACE/target/release/amaru" node bootstrap \
            --network "$AMARU_NETWORK" \
            --ledger-dir "$SCRATCH/ledger.db" \
            --chain-dir "$SCRATCH/chain.db" \
            ${INPUT_EPOCH:+--epoch "$INPUT_EPOCH"}
          test -d "$SCRATCH/ledger.db"
          test -d "$SCRATCH/chain.db"

      - name: Clean up smoke test scratch directory
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${SCRATCH:-}" ]; then
            rm -rf "$SCRATCH"
          fi
          if [ -n "${DB_ANALYSER_TMP:-}" ]; then
            rm -rf "$DB_ANALYSER_TMP"
          fi
