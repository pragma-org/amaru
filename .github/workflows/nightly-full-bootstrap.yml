name: Nightly Full Bootstrap

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap-to-tip:
    name: Bootstrap ${{ matrix.network }} and synchronize to tip
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        network: [preprod, preview, mainnet]

    env:
      AMARU_NETWORK: ${{ matrix.network }}
      AMARU_TUI_OFF: "true"
      AMARU_WITH_JSON_TRACES: "true"
      AMARU_TRACE: "error,amaru=info,amaru_pure_stage=warn"
      AMARU_BIN: target/release/amaru

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/cache
      - uses: ./.github/actions/stage-peer-snapshots

      - name: Build Amaru
        shell: bash
        run: |
          cargo build --release --locked --bin amaru
          test -x "$AMARU_BIN"

      - name: Bootstrap from scratch and synchronize to the initial tip
        id: bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail

          state_dir="$RUNNER_TEMP/amaru-nightly-full-bootstrap-$AMARU_NETWORK"
          export AMARU_DB_LEDGER="$state_dir/ledger.db"
          export AMARU_DB_CHAIN="$state_dir/chain.db"
          mkdir -p "$state_dir"

          koios_host="$AMARU_NETWORK"
          if [[ "$AMARU_NETWORK" == "mainnet" ]]; then
            koios_host="api"
          fi

          target_slot="$(
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              "https://$koios_host.koios.rest/api/v1/tip" \
              | jq -er '.[0].abs_slot'
          )"
          echo "Network tip at test start: slot $target_slot"

          source scripts/demos/common/amaru.sh
          amaru_pid=""
          current_log=bootstrap.log

          trap '
            if [[ -n "$amaru_pid" ]]; then
              kill -KILL "$amaru_pid" 2>/dev/null || true
              wait "$amaru_pid" || true
            fi
          ' EXIT

          fail() {
            echo "::group::Last 200 lines of $current_log" >&2
            tail -200 "$current_log" >&2 || true
            echo "::endgroup::" >&2
            echo "::error::$1" >&2
            printf '## Full bootstrap failed (%s)\n\n~~~text\n%s\n~~~\n' \
              "$AMARU_NETWORK" "$1" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          }

          : > bootstrap.log
          bootstrap_epochs="$("$AMARU_BIN" snapshot epochs)"
          bootstrap_epoch="${bootstrap_epochs%%$'\n'*}"
          [[ "$bootstrap_epoch" =~ ^[0-9]+$ ]] || fail "No bootstrap epochs available for $AMARU_NETWORK"
          echo "Earliest available bootstrap epoch: $bootstrap_epoch"

          "$AMARU_BIN" node bootstrap --epoch "$bootstrap_epoch" > bootstrap.log 2>&1 &
          amaru_pid=$!
          wait "$amaru_pid" || fail "Amaru bootstrap failed (exit status $?)"
          amaru_pid=""
          cat bootstrap.log

          current_log=amaru.log
          : > amaru.log
          "$AMARU_BIN" node run > amaru.log 2>&1 &
          amaru_pid=$!

          while true; do
            if ! kill -0 "$amaru_pid" 2>/dev/null; then
              status=0
              wait "$amaru_pid" || status=$?
              amaru_pid=""
              fail "Amaru stopped before reaching target slot $target_slot (exit status $status)"
            fi

            adopted_slot="$(adopted_slot_from_log amaru.log)"
            echo "Amaru slot: ${adopted_slot:-initializing}; target: $target_slot"

            if [[ "$adopted_slot" =~ ^[0-9]+$ ]] && (( adopted_slot >= target_slot )); then
              echo "Amaru reached target slot $target_slot at slot $adopted_slot"
              kill -INT "$amaru_pid"
              wait "$amaru_pid" || fail "Amaru shutdown failed (exit status $?)"
              amaru_pid=""
              trap - EXIT
              exit 0
            fi

            sleep 5
          done

      - name: Report Amaru errors and warnings
        if: always()
        shell: bash
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
        run: |
          printf '## Amaru errors and warnings\n\nFull logs are uploaded as artifacts.\n\n' \
            >> "$GITHUB_STEP_SUMMARY"
          for log in bootstrap.log amaru.log; do
            if [[ ! -f "$log" ]]; then
              printf '%s: no log was produced.\n\n' "$log" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            entries="$(jq -Rc '
              fromjson? | objects | select(.level == "ERROR" or .level == "WARN")
              | {level, message: "\(input_line_number):\(.timestamp) \(.level) \(.target) \(.fields | tojson)"}
            ' "$log" | tail -20)"
            {
              printf '### %s: latest errors and warnings (up to 20)\n\n<pre>\n' "$log"
              printf '%s\n' "$entries" | jq -r '.message[:2000] | @html'
              printf '</pre>\n\n'
            } >> "$GITHUB_STEP_SUMMARY"

            if [[ "$BOOTSTRAP_OUTCOME" == "failure" ]]; then
              printf '%s\n' "$entries" | tail -5 | jq -r --arg log "$log" '
                (if .level == "ERROR" then "error" else "warning" end) as $command
                | "\($log):\(.message[:2000])"
                | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")
                | "::\($command)::\(.)"
              '
            fi
          done

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        with:
          name: nightly-full-bootstrap-${{ matrix.network }}-logs
          path: |
            bootstrap.log
            amaru.log
          if-no-files-found: warn
          retention-days: 7
