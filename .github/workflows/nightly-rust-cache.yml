name: Nightly Rust Cache

# The only writer of the Rust cache. Runners and commands must match ci-build-and-test.yml, whose jobs restore it.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-rust-cache
  cancel-in-progress: true

jobs:
  cache-linux-x86_64:
    name: Cache x86_64/linux
    uses: ./.github/workflows/template-cargo-test.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      cache-mode: WRITE

  # To populate the cache on the Blacksmith runners too.
  cache-linux-x86_64-blacksmith:
    name: Cache x86_64/linux (Blacksmith)
    uses: ./.github/workflows/template-cargo-test.yml
    with:
      runner: blacksmith-2vcpu-ubuntu-2404
      target: x86_64-unknown-linux-gnu
      command: test -p amaru --no-run
      cache-mode: WRITE

  cache-linux-aarch64:
    name: Cache aarch64/linux
    uses: ./.github/workflows/template-cargo-test.yml
    with:
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      cache-mode: WRITE

  cache-macos-aarch64:
    name: Cache aarch64/macos
    uses: ./.github/workflows/template-cargo-test.yml
    with:
      runner: macos-15
      target: aarch64-apple-darwin
      cache-mode: WRITE

  cache-windows-x86_64:
    name: Cache x86_64/windows
    uses: ./.github/workflows/template-cargo-test.yml
    with:
      runner: blacksmith-4vcpu-windows-2025
      target: x86_64-pc-windows-msvc
      command: test --tests --workspace --profile dev-debug
      cache-mode: WRITE
