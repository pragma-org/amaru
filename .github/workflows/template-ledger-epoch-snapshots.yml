name: Template Ledger Epoch Snapshots

on:
  workflow_call:
    inputs:
      network:
        description: "Network to run (leave empty for both)"
        type: string
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUSTUP_LOG: error

permissions:
  contents: read

jobs:
  snapshots:
    name: End-to-end snapshot tests
    runs-on: blacksmith-8vcpu-ubuntu-2404
    concurrency:
      group: ledger-epoch-snapshots-${{ matrix.network.name }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        network:
          - name: preprod
            magic: 1
            peer: preprod-node.play.dev.cardano.org:3001
            start_epoch: 270
            target_epoch: 280
          - name: preview
            magic: 2
            peer: preview-node.play.dev.cardano.org:3001
            start_epoch: 1119
            target_epoch: 1180
        cardano_node_version: [11.0.1]
    env:
      AMARU_NETWORK: ${{ inputs.network || matrix.network.name }}
      AMARU_PEER_ADDRESS: ${{ matrix.network.peer }}
      AMARU_UPSTREAM_PEERS: 1
      BUILD_PROFILE: test
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      TRACE_CONTRACT: data/${{ matrix.network.name }}/run-until-trace-contract.json
      TRACE_COMPARE_LOG: trace-compare.log
      AMARU_WITH_OPEN_TELEMETRY: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4317"
      OTEL_METRIC_EXPORT_INTERVAL: 1000
      RUST_BACKTRACE: 1

    steps:
      - name: Support longpaths
        run: git config --system core.longpaths true
        if: runner.os == 'Windows'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim Disk Space
        run: |
          chmod +x ./scripts/cleanup-runner.sh
          ./scripts/cleanup-runner.sh

      - uses: ./.github/actions/stage-peer-snapshots
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}

      - uses: ./.github/actions/cache
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}

      - name: Bootstrap DBs
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}
        uses: ./.github/actions/bootstrap-db
        with:
          network: ${{ matrix.network.name }}
          epoch: ${{ matrix.network.start_epoch }}

      - name: Start OTLP collector
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}
        shell: bash
        run: |
          docker run -d --network host \
            --name otlp-collector \
            -v "$PWD/monitoring/otlp-collector.yml:/etc/otlp-collector.yml:ro" \
            otel/opentelemetry-collector-contrib:0.133.0@sha256:98274b756324abdb2473fa0c898247a246091e861e61d1548f9be483198eecea \
              --config=/etc/otlp-collector.yml \
              --set exporters::prometheus::metric_expiration=10m

      - name: Run epoch snapshot tests
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}
        timeout-minutes: 30
        shell: bash
        env:
          # running with DEBUG log level doesn’t work when github actions are collecting the logs because
          # it takes many seconds to empty the log buffer after `run-until` exists, at which point the
          # metrics are no longer retained within the collector.
          AMARU_TRACE: "amaru=info"
        run: |
          ./scripts/run-until-then-test \
            "${{ matrix.network.start_epoch }}" \
            "${{ matrix.network.target_epoch }}"

      - name: Wait for metrics endpoints
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}
        shell: bash
        run: |
          timeout 120 bash -c \
            'until curl -sf http://localhost:8889/metrics | grep -q "^cardano_node_metrics_"; do sleep 2; done' || {
            echo "Amaru metrics did not become available within 120s."
            docker logs otlp-collector 2>&1 | tail -20 || true
            exit 1
          }
          timeout 120 bash -c \
            'until curl -sf http://localhost:12798/metrics | grep -q "^cardano_node_metrics_"; do sleep 2; done' || {
            echo "cardano-node metrics did not become available within 120s."
            docker logs cardano-node 2>&1 | tail -30 || true
            exit 1
          }

      - name: Check metrics conformance
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}
        shell: bash
        run: |
          scripts/compare-metrics \
            --check \
            --output "metrics-report-${{ matrix.network.name }}.json" \
            --summary

      - name: Upload metrics report
        if: ${{ always() && (inputs.network == '' || inputs.network == matrix.network.name) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        with:
          name: metrics-coverage-report-${{ matrix.network.name }}
          path: metrics-report-${{ matrix.network.name }}.json
          if-no-files-found: warn

      - name: Teardown metrics collector and Haskell node
        if: ${{ always() && (inputs.network == '' || inputs.network == matrix.network.name) }}
        shell: bash
        run: |
          docker logs --tail 50 otlp-collector || true
          docker rm -f otlp-collector || true
          docker logs --tail 200 cardano-node || true
          docker rm -f cardano-node || true
