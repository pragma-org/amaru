name: Template Ledger Epoch Snapshots

on:
  workflow_call:
    inputs:
      network:
        description: "Network to run (leave empty for both)"
        type: string
        required: false
        default: ""
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      S3_ENDPOINT:
        required: true
      CARDANO_NODE_BUCKET_NAME:
        required: true
      PREPROD_TX_PAYMENT_SKEY_BASE64:
        required: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_LOG: error

permissions:
  contents: read
  actions: write

jobs:
  snapshots:
    name: End-to-end snapshot tests
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ matrix.network.name == 'preprod' && 'preprod-e2e-transaction-submission' || format('ledger-epoch-snapshots-{0}-{1}', github.run_id, matrix.network.name) }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        network:
          - name: preprod
            magic: 1
            start_epoch: 270
            target_epoch: 280
          - name: preview
            magic: 2
            start_epoch: 1119
            target_epoch: 1180
        cardano_node_version: [11.0.1]
    env:
      AMARU_NETWORK: ${{ inputs.network || matrix.network.name }}
      AMARU_PEER_ADDRESS: 127.0.0.1:3001
      AMARU_UPSTREAM_PEERS: 1
      BUILD_PROFILE: test
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      E2E_TX_WORK_DIR: ${{ github.workspace }}/e2e-tx-submission-output
      OBJECT: "s3://${{ secrets.CARDANO_NODE_BUCKET_NAME }}/${{ matrix.network.name }}.tar.zstd"
      TRACE_CONTRACT: data/${{ matrix.network.name }}/run-until-trace-contract.json
      TRACE_COMPARE_LOG: trace-compare.log
      AMARU_WITH_OPEN_TELEMETRY: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4317"
      OTEL_METRIC_EXPORT_INTERVAL: 1000
      RUST_BACKTRACE: 1

    steps:
      - name: Support longpaths
        run: git config --system core.longpaths true
        if: runner.os == 'Windows'

      - uses: actions/checkout@v6

      - name: Configure runner paths
        shell: bash
        run: |
          {
            echo "CARDANO_NODE_DB=$RUNNER_TEMP/db-${{ matrix.network.name }}"
            echo "CARDANO_NODE_SOCKET_FILE=$RUNNER_TEMP/ipc/node.socket"
            echo "TX_PAYMENT_SKEY=$RUNNER_TEMP/preprod-e2e-payment.skey"
          } >> "$GITHUB_ENV"

      - name: Reclaim Disk Space
        run: |
          chmod +x ./scripts/cleanup-runner.sh
          ./scripts/cleanup-runner.sh

      - name: Download (Haskell) cardano-node's db
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CARDANO_NODE_DB" "$(dirname "$CARDANO_NODE_SOCKET_FILE")"
          aws s3 cp "$OBJECT" - --endpoint-url "$ENDPOINT" | tar --zstd -xf - -C "$CARDANO_NODE_DB"
          touch "$CARDANO_NODE_DB/clean"

      - name: Spawn Haskell Node
        id: spawn-cardano-node
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}
        shell: bash
        env:
          CONFIG_DIR: cardano-node-config/${{ matrix.network.name }}
        run: |
          set -euo pipefail
          docker pull ghcr.io/intersectmbo/cardano-node:${{ matrix.cardano_node_version }}
          make download-haskell-config
          jq '
            .UseTraceDispatcher = true
            | .TraceOptionMetricsPrefix = "cardano.node.metrics."
            | .TraceOptionResourceFrequency = 1000
            | .TraceOptions = (.TraceOptions // {})
            | .TraceOptions[""] = ((.TraceOptions[""] // {}) + {
                "backends": [
                  "EKGBackend",
                  "PrometheusSimple suffix 0.0.0.0 12798",
                  "Stdout HumanFormatUncoloured"
                ],
                "detail": "DNormal",
                "severity": "Notice"
              })
            | .TraceOptions.ChainDB = ((.TraceOptions.ChainDB // {}) + {"severity": "Info"})
            | .TraceOptions.Resources = ((.TraceOptions.Resources // {}) + {"severity": "Silence"})
          ' "./$CONFIG_DIR/config.json" > "$CONFIG_DIR/config.patched.json"
          mv "$CONFIG_DIR/config.patched.json" "$CONFIG_DIR/config.json"
          jq 'del(.bootstrapPeers) | del(.peerSnapshotFile) | .useLedgerAfterSlot = -1' "./$CONFIG_DIR/topology.json" > "$CONFIG_DIR/topology.patched.json"
          mv "$CONFIG_DIR/topology.patched.json" "$CONFIG_DIR/topology.json"
          jq '.hasPrometheus = ["0.0.0.0", 12798]' "./$CONFIG_DIR/config.json" > "$CONFIG_DIR/config.patched.json"
          mv "$CONFIG_DIR/config.patched.json" "$CONFIG_DIR/config.json"
          docker run -d --name cardano-node \
            -v "$CARDANO_NODE_DB:/db" \
            -v "$(dirname "$CARDANO_NODE_SOCKET_FILE"):/ipc" \
            -v "./$CONFIG_DIR:/config" \
            -v "./$CONFIG_DIR:/genesis" \
            -p 3001:3001 \
            -p 127.0.0.1:12798:12798 \
            ghcr.io/intersectmbo/cardano-node:${{ matrix.cardano_node_version }} run \
              --config /config/config.json \
              --database-path /db \
              --socket-path /ipc/node.socket \
              --topology /config/topology.json

      - uses: ./.github/actions/stage-peer-snapshots
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}

      - uses: ./.github/actions/cache
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}

      - name: Bootstrap DBs
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}
        uses: ./.github/actions/bootstrap-db
        with:
          network: ${{ matrix.network.name }}
          epoch: ${{ matrix.network.start_epoch }}

      - name: Start OTLP collector
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}
        shell: bash
        run: |
          docker run -d --network host \
            --name otlp-collector \
            -v "$PWD/monitoring/otlp-collector.yml:/etc/otlp-collector.yml:ro" \
            otel/opentelemetry-collector-contrib:0.133.0 \
              --config=/etc/otlp-collector.yml \
              --set exporters::prometheus::metric_expiration=10m

      - name: Run epoch snapshot tests
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}
        timeout-minutes: 30
        shell: bash
        env:
          # running with DEBUG log level doesn’t work when github actions are collecting the logs because
          # it takes many seconds to empty the log buffer after `run-until` exists, at which point the
          # metrics are no longer retained within the collector.
          AMARU_TRACE: "amaru=info"
        run: |
          ./scripts/run-until-then-test \
            "${{ matrix.network.start_epoch }}" \
            "${{ matrix.network.target_epoch }}"

      - name: Wait for metrics endpoints
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}
        shell: bash
        run: |
          timeout 120 bash -c \
            'until curl -sf http://localhost:8889/metrics | grep -q "^cardano_node_metrics_"; do sleep 2; done' || {
            echo "Amaru metrics did not become available within 120s."
            docker logs otlp-collector 2>&1 | tail -20 || true
            exit 1
          }
          timeout 120 bash -c \
            'until curl -sf http://localhost:12798/metrics | grep -q "^cardano_node_metrics_"; do sleep 2; done' || {
            echo "cardano-node metrics did not become available within 120s."
            docker logs cardano-node 2>&1 | tail -30 || true
            exit 1
          }

      - name: Check metrics conformance
        if: ${{ inputs.network == '' || inputs.network == matrix.network.name }}
        shell: bash
        run: |
          scripts/compare-metrics \
            --check \
            --output "metrics-report-${{ matrix.network.name }}.json" \
            --summary

      - name: Run transaction submission test
        if: ${{ matrix.network.name == 'preprod' && (inputs.network == '' || inputs.network == matrix.network.name) }}
        timeout-minutes: 30
        shell: bash
        env:
          AMARU_CHAIN_DIR: ${{ github.workspace }}/chain.${{ matrix.network.name }}.db
          AMARU_LEDGER_DIR: ${{ github.workspace }}/ledger.${{ matrix.network.name }}.db
          CARDANO_NODE_SYNC_TIMEOUT_SECONDS: 1200
          E2E_TX_MANAGE_CARDANO_NODE: "false"
          E2E_TX_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.network.name }}
          TX_PAYMENT_SKEY_BASE64: ${{ secrets.PREPROD_TX_PAYMENT_SKEY_BASE64 }}
          TX_SYNC_TIMEOUT_SECONDS: 1200
        run: |
          set -euo pipefail
          ./scripts/e2e/tx-submission.sh run

      - name: Collect transaction submission logs
        if: ${{ always() && matrix.network.name == 'preprod' && (inputs.network == '' || inputs.network == matrix.network.name) }}
        shell: bash
        run: |
          mkdir -p "$E2E_TX_WORK_DIR/logs"
          docker logs cardano-node > "$E2E_TX_WORK_DIR/logs/cardano-node-docker.log" 2>&1 || true

      - name: Upload transaction submission artifacts
        if: ${{ always() && matrix.network.name == 'preprod' && (inputs.network == '' || inputs.network == matrix.network.name) }}
        uses: actions/upload-artifact@v7
        with:
          name: transaction-submission-${{ matrix.network.name }}
          path: |
            ${{ env.E2E_TX_WORK_DIR }}/logs
            ${{ env.E2E_TX_WORK_DIR }}/results
          if-no-files-found: warn

      - name: Upload metrics report
        if: ${{ always() && (inputs.network == '' || inputs.network == matrix.network.name) }}
        uses: actions/upload-artifact@v7
        with:
          name: metrics-coverage-report-${{ matrix.network.name }}
          path: metrics-report-${{ matrix.network.name }}.json
          if-no-files-found: warn

      - name: Teardown metrics collector and Haskell node
        if: ${{ always() && (inputs.network == '' || inputs.network == matrix.network.name) }}
        shell: bash
        run: |
          docker logs --tail 50 otlp-collector || true
          docker rm -f otlp-collector || true
          docker logs --tail 200 cardano-node || true
          docker rm -f cardano-node || true
