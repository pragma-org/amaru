name: CI Ledger Rules Coverage

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      - "crates/amaru-ledger/src/rules.rs"
      - "crates/amaru-ledger/src/rules/**"
      - "crates/amaru-ledger/tests/data/transaction/**"
      - ".github/workflows/ci-ledger-rules-coverage.yml"
      - "codecov.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/amaru-ledger/src/rules.rs"
      - "crates/amaru-ledger/src/rules/**"
      - "crates/amaru-ledger/tests/data/transaction/**"
      - ".github/workflows/ci-ledger-rules-coverage.yml"
      - "codecov.yml"

env:
  CARGO_TERM_COLOR: always
  # NOTE: Necessary for cache
  CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Ledger rules coverage
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/cache

      - run: rustup component add llvm-tools-preview

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # https://github.com/taiki-e/install-action/releases/tag/v2.88.1
        with:
          tool: cargo-llvm-cov

      - run: make coverage-ledger-rules

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # https://github.com/codecov/codecov-action/releases/tag/v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: ledger-rules
          disable_search: true
