lints.workspace = true

[package]
name = "amaru-consensus"
version = "0.1.2"
edition.workspace = true
description = "Consensus engine for the Amaru Cardano node"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["test-utils"]
profiling = ["dep:pprof"]
test-utils = ["proptest", "dep:tracing-subscriber", "dep:pretty_assertions"]

[dependencies]
async-trait.workspace = true
anyhow.workspace = true
hex.workspace = true
hickory-resolver.workspace = true
opentelemetry.workspace = true
parking_lot.workspace = true
pretty_assertions = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }
rand = { workspace = true }
rayon.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "net"] }
tracing-subscriber = { workspace = true, optional = true }

amaru-kernel.workspace = true
amaru-ledger.workspace = true
amaru-mempool.workspace = true
amaru-metrics.workspace = true
amaru-observability.workspace = true
amaru-ouroboros-traits.workspace = true
amaru-ouroboros.workspace = true
amaru-plutus.workspace = true
amaru-protocols.workspace = true
amaru-pure-stage.workspace = true

[target.'cfg(all(not(target_family="wasm"), not(target_arch="riscv32")))'.dependencies]
amaru-deps.workspace = true

[dev-dependencies]
hex.workspace = true
pretty_assertions.workspace = true
proptest.workspace = true
rand.workspace = true
criterion.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
tracing-subscriber.workspace = true

amaru-kernel = { workspace = true, features = ["test-utils"] }
amaru-ouroboros-traits = { workspace = true, features = ["test-utils"] }

[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15", features = ["flamegraph"], optional = true }

[[bench]]
name = "stage_msgs"
harness = false
required-features = ["test-utils"]

[package.metadata.cargo-machete]
ignored = ["amaru-deps"]
