schema-version = "1.12.0"

[install]
# Haskell toolchain. cardano-node 10.5.x (which the cabal.project pins)
# tested against GHC 9.6.x
ghc.pkg-path = "haskell.compiler.ghc96"
ghc.outputs = "all"
cabal-install.pkg-path = "cabal-install"

# Build tools the Makefile relies on.
gnumake.pkg-path = "gnumake"
gnumake.outputs = "all"
pkg-config.pkg-path = "pkg-config"
pkg-config.outputs = "all"
autoconf.pkg-path = "autoconf"
autoconf.outputs = "all"
libtool.pkg-path = "libtool"
libtool.outputs = "all"
automake.pkg-path = "automake"

# Native deps for the Haskell stack and crypto libs.
libffi.pkg-path = "libffi"
libffi.outputs = "all"
zlib.pkg-path = "zlib"
zlib.outputs = "all"
gmp.pkg-path = "gmp"
gmp.outputs = "all"
libsodium.pkg-path = "libsodium"
libsodium.outputs = "all"
llvm.pkg-path = "llvm"
llvm.outputs = "all"
lmdb.pkg-path = "lmdb"
lmdb.outputs = "all"
pcre.pkg-path = "pcre"           # for `regex-pcre*` Haskell bindings (PCRE 1)
pcre.outputs = "all"
# pcre2.pkg-path = "pcre2"        # uncomment if cabal pulls in a PCRE-2-based binding
# pcre2.outputs = "all"
openssl.pkg-path = "openssl"
openssl.outputs = "all"
secp256k1.pkg-path = "secp256k1"
secp256k1.outputs = "all"
blst.pkg-path = "blst"
blst.outputs = "all"

[hook]
on-activate = '''
  echo "haskell-node-extractor env active."
  echo "First build:  make prerequisites && make build"
  echo "Run binary:   cabal run exe:haskell-node-extractor -- --help"
  '''
[profile]
common = '''
  '''

[options]
systems = ["x86_64-linux", "aarch64-linux", "aarch64-darwin", "x86_64-darwin"]
