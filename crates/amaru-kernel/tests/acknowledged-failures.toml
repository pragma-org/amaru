# Failures the decoders are known to produce against the conformance corpus.
#
# Each entry lets the suite observe one defect without failing, so a partially conforming decoder
# still publishes a report.
#
# Delete an entry as soon as its fix lands. An entry that no longer matches any failure fails the
# run, which is what keeps this list shrinking.

[[acknowledged]]
rule = "auxiliary_data"
class = "re-encoding differs from the cbor reference"

[[acknowledged]]
rule = "certificate"
class = "decoded successfully, should be rejected"

[[acknowledged]]
rule = "cost_models"
class = "re-encoding differs from the cbor reference"

[[acknowledged]]
rule = "gov_action"
class = "decoded successfully, should be rejected"

