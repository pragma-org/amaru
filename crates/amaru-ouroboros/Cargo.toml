lints.workspace = true

[package]
name = "amaru-ouroboros"
version = "0.1.2"
edition.workspace = true
description = "Ouroboros consensus protocol primitives for the Amaru Cardano node"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# External dependencies ───────────────────────────────────────────────────────┐
getrandom = { workspace = true, features = ["wasm_js"] }
hex.workspace = true
kes-summed-ed25519.workspace = true
pallas-codec.workspace = true
pallas-crypto.workspace = true
pallas-math.workspace = true
pallas-primitives.workspace = true
serde.workspace = true

# Internal dependencies ───────────────────────────────────────────────────────┐
amaru-kernel.workspace = true
amaru-ouroboros-traits.workspace = true
amaru-pure-stage.workspace = true

[package.metadata.cargo-machete]
ignored = ["getrandom"]

[dev-dependencies]
# External dependencies ───────────────────────────────────────────────────────┐
serde.workspace = true

[target.'cfg(not(std))'.dependencies]
num = { workspace = true, default-features = false, features = [
  "alloc",
  "libm",
] }
