body: '`header.announced`, `block.requested`, `block.received`, and `block.adopted` are always debug, including while the node is live. `block.adopted` is recorded for every block placed on the best chain, including the blocks between a fork and the new tip. `tip.adopt` logs only the new tip: while syncing, at most one info line per second; once live, one info line per block.'
