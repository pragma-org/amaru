receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:
  resource/drop_prometheus_labels:
    attributes:
      - key: service.name
        action: delete
      - key: service.instance.id
        action: delete

exporters:
  otlp_grpc/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: "http://loki:3100/otlp"
  prometheus:
    endpoint: "0.0.0.0:8889"
    add_metric_suffixes: false
    metric_expiration: 5s
    without_scope_info: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource/drop_prometheus_labels, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
