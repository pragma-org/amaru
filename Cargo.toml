[workspace.package]
edition = "2024"
description = "A Cardano blockchain node implementation"
license = "Apache-2.0"
authors = ["Amaru Maintainers <amaru@pragma.builders>"]
repository = "https://github.com/pragma-org/amaru"
homepage = "https://github.com/pragma-org/amaru"
documentation = "https://docs.rs/amaru"
keywords = ["cardano", "blockchain", "node", "ouroboros", "crypto"]
categories = ["cryptography::cryptocurrencies"]
rust-version = "1.97" # Find versions here: https://rust-lang.github.io/rustup-components-history

[workspace]
members = ["crates/*", "crates/amaru-deps", "crates/amaru-observability/macros/", "crates/vendor/*"]
exclude = ["crates/vendor"]
default-members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
# External dependencies
acto = { version = "0.8.0", features = ["tokio"] }
anyhow = "1.0.104"
append-only-vec = "0.1.8"
assert-json-diff = "2.0.2"
assert_cmd = "2.2.2"
assertables = "10.1.0"
async-compression = { version = "0.4.32", features = ["tokio", "gzip"] }
async-trait = "0.1.91"
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
axum = "0.8.9"
base58 = "0.2.0"
bech32 = "0.12.0"
binrw = "0.15.0"
blst = "0.3.16"
built = "0.8.1"
bumpalo = "3.20.3"
bytes = "1.12.1"
cbor-data = "0.8.19"
cbor4ii = { version = "1.1.1", features = ["serde1", "use_std"] }
chumsky = "1.0.0-alpha.8"
clap = { version = "4.6.2", features = ["derive", "env"] }
clap_complete = "4.6.7"
clap_mangen = "0.3.0"
crc = "3.0.1"
criterion = "0.8.2"
crossterm = "0.29.0"
cryptoxide = { version = "0.6.1", features = ["digest"]}
ctor = "1.0.9"
dashu-base = "0.4.1"
dashu-int = "0.4.1"
diff_json = "0.1.1"
divan = "0.1.21"
ed25519-dalek = "3.0.0"
either = "1.16.0"
erased-serde = "0.4.10"
flate2 = "1.1.9"
futures-util = "0.3.33"
getrandom = { version = "0.3", features = ["wasm_js"] }
hamming = "0.1.3"
hex = "0.4.3"
hickory-resolver = { version = "0.25.2", default-features = false, features = ["tokio", "system-config"] }
http-body-util = "0.1.3"
include_dir = "0.7.4"
indexmap = { version = "2.14.0", features = ["serde"] }
indicatif = "0.18.6"
indoc = "2.0"
insta = "1.48.0"
inventory = "0.3.24"
itertools = "0.15.0"
libc = "0.2"
minicbor = { version = "0.25.1", features = ["std", "half", "derive"] }
mithril-client = { version = "0.14.5", default-features = false, features = ["fs", "num-integer-backend", "rustls-tls"] }
num = { version = "0.4.3", default-features = false, features = ["alloc"] }
num-bigint = "0.4.6"
num-integer = "0.1.46"
once_cell = "1.21.4"
opentelemetry = "0.32.0"
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = [ "grpc-tonic", "http-proto", "logs", "reqwest-blocking-client", ] }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = [ "gen-tonic", "trace", "logs", "metrics" ] }
opentelemetry-semantic-conventions = { version = "0.32.1", features = ["semconv_experimental"] }
opentelemetry_sdk = { version = "0.32.1", features = ["logs"] }
ouroboros = "0.18.5"
pallas-network = "0.34.0"
parking_lot = "0.12.3"
poolshark = "0.2.9"
pretty_assertions = "1.4.1"
proc-macro2 = "1.0.107"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
quote = "1.0.47"
rand = "0.9.2"
rand_distr = "0.5.1"
ratatui = "0.29.0"
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["query", "json", "stream"] }
rocksdb = { version = "0.24.0", default-features = false, features = [ "bindgen-runtime", "snappy", "multi-threaded-cf" ] }
rustversion = "1.0.23"
schemars = { version = "0.8.22", default-features = false, features = ["derive"] }
secp256k1 = "0.30.0"
serde = { version = "1.0.229", default-features = false, features = ["alloc"] }
serde_cbor = "0.11.2"
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
serde_with = "3.11.0"
sha3 = "0.12.0"
signal-hook = { version = "0.3", default-features = false }
socket2 = "0.6.5"
syn = { version = "3.0.2", features = ["full"] }
sysinfo = "0.39.6"
tar = "0.4.46"
tempfile = "3.27.0"
test-case = "3.3.1"
thiserror = "2.0.19"
tikv-jemallocator = { version = "0.6.1" }
tokio = { version = "1.53.0", features = ["sync"] }
tokio-util = "0.7.18"
toml = "1.1.3"
tonic = "0.14.6"
tracing = { version = "0.1.40", features = ["valuable"] }
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = [ "env-filter", "std", "json", ] }
trybuild = "1.0.118"
typetag = "0.2.23"
ureq = { version = "2.12.1", default-features = false, features = ["tls", "json"] }
walkdir = "2.5.0"
xz = "0.4.6-rc.0"
zeroize = "1.9.0"
zstd = "0.13.3"

# The vrf crate has not been fully tested in production environments and still has several upstream issues that are open PRs but not merged yet.
vrf_dalek = { package = "amaru-vrf-dalek", path = "crates/vendor/amaru-vrf-dalek", version = "0.1.0" }
kes-summed-ed25519 = { package = "amaru-kes-summed-ed25519", path = "crates/vendor/amaru-kes-summed-ed25519", version = "0.2.1" }
# curve25519-dalek fork used by vrf_dalek (txpipe/curve25519-dalek@70a36f41, branch ietf03_vrf_compat_ell2)
amaru-curve25519-dalek = { package = "amaru-curve25519-dalek", path = "crates/vendor/amaru-curve25519-dalek", version = "3.2.0" }

# Internal dependencies
amaru = { path = "crates/amaru" }
amaru-consensus = { path = "crates/amaru-consensus", version = "0.1.2" }
amaru-deps = { path = "crates/amaru-deps", version = "0.0.0" }
amaru-fixture-builder = { path = "crates/amaru-fixture-builder", version = "0.1.2" }
amaru-iter-borrow = { path = "crates/amaru-iter-borrow", version = "0.1.2" }
amaru-kernel = { path = "crates/amaru-kernel", version = "0.1.2" }
amaru-ledger = { path = "crates/amaru-ledger", version = "0.1.2" }
amaru-mempool = { path = "crates/amaru-mempool", version = "0.1.2" }
amaru-metrics = { path = "crates/amaru-metrics", version = "0.1.2" }
amaru-minicbor-extra = { path = "crates/amaru-minicbor-extra", version = "0.1.2" }
amaru-mithril = { path = "crates/amaru-mithril", version = "0.1.2" }
amaru-network = { path = "crates/amaru-network", version = "0.1.2" }
amaru-bootstrap = { path = "crates/amaru-bootstrap", version = "0.1.0" }
amaru-node = { path = "crates/amaru-node", version = "0.1.0" }
amaru-observability = { path = "crates/amaru-observability", version = "0.1.2" }
amaru-observability-macros = { path = "crates/amaru-observability/macros", version = "0.1.2" }
amaru-ouroboros = { path = "crates/amaru-ouroboros", version = "0.1.2" }
amaru-ouroboros-traits = { path = "crates/amaru-ouroboros-traits", version = "0.1.2" }
amaru-plutus = { path = "crates/amaru-plutus", version = "0.1.2" }
amaru-progress-bar = { path = "crates/amaru-progress-bar", version = "0.1.2" }
amaru-protocols = { path = "crates/amaru-protocols", version = "0.1.2" }
amaru-pure-stage = { path = "crates/amaru-pure-stage", version = "0.1.2" }
amaru-sim = { path = "crates/amaru-sim", version = "0.1.2" }
amaru-stores = { path = "crates/amaru-stores", version = "0.1.2" }
amaru-tui = { path = "crates/amaru-tui", version = "0.1.2" }
amaru-uplc = { path = "crates/amaru-uplc", version = "0.4.0" }

[workspace.lints.rust]
rust_2018_idioms = "warn"
rust_2018_compatibility = "warn"
rust_2021_compatibility = "warn"
#rust_2024_compatibility = "warn"
nonstandard_style = { level = "deny" }
future_incompatible = { level = "deny" }

[workspace.lints.clippy]
# Enable clippy lints for all members
# * https://doc.rust-lang.org/clippy/lints.html


# Group lints

# pedantic = "warn"
# restriction = "warn"
# nursery = "warn"
# cargo = "warn"
# others are enabled by default, see table here: https://doc.rust-lang.org/clippy/

# Individual lints

# All lints are detailed here: https://rust-lang.github.io/rust-clippy/master/index.html
# allow-unwrap-in-tests = true
# unreachable = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"
print_stdout = "deny" # Breaks user piping, see https://github.com/rust-lang/rust/issues/119980

# See https://doc.rust-lang.org/cargo/reference/profiles.html

[profile.dev]
opt-level = 2
debug = false

[profile.dev-debug]
# Restore default 'dev' profile (see https://doc.rust-lang.org/cargo/reference/profiles.html#dev)
inherits = "dev"
opt-level = 0
debug = true

[profile.release]
lto = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

[workspace.metadata.cross.target.aarch64-unknown-linux-musl]
pre-build = [
  "apt update",
  "apt install -y libclang-dev"
]
[workspace.metadata.cross.target.aarch64-unknown-linux-musl.env]
passthrough = ["LIBCLANG_PATH=/usr/lib/llvm-10/lib"]
